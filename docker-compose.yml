name: mariadb_for_everyone
services:
  db:
    image: mariadb:11.8
    restart: always
    volumes:
      - type: volume
        source: mariadb
        target: /var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ./conf.d:/etc/mysql/conf.d:ro
    env_file:
      - .env
    ports:
      - 127.0.0.1:${MARIADB_PORT:-3306}:3306
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mariadb:
